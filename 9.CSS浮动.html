<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9.CSS浮动</title>
    <style> 
        .father{background-color: aqua;
          /* height: 150px;*/
            border:3px solid brown;       
        }

        .father::after{
            content: "";
            display: table;
            clear:both;
        }
         .left.son{
            background-color:green;
            height: 100px;
            width: 100px;
            float: left;
         }

         .right.son{
            background-color: gold;
            height: 100px;
            width: 100px;
            float: right;
         }
    
    </style>
</head>
<body>
   <div class="father">
   <div class="left son">左浮动</div>
   <div class="right son">右浮动</div>
 
   </div>
   <p>这是一段文本这是一段文本这是一段文本这是一段文本这是一段文本这是一段文本这是一段文本这是一段文本</p>
</body>

</html>
