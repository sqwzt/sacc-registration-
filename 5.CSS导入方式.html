<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS导入方式</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 内部样式 */
        p {
            color: blue;
            font-size: 26px;
            font-family: Arial, sans-serif;
        }
        h2{
            color: green;
            font-size: 30px;
            font-family: 'Times New Roman', serif;
        }
        h3{
            color: rgb(0, 255, 145);
            font-size: 28px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <p>
        这是一个应用了CSS样式的段落。</p>
    <h1 style="color: blue; font-size: 36px;">这是一个一级标题标签，使用内联样式</h1>
    <h2>这是一个二级标题标签，使用内部样式。</h2>
    <h3>这是一个三级标题标签，使用外部样式。</h3>
</body>
</html>
