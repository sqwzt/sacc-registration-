<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML表单</title>
</head>
<body>
    <form>  
        <label for="username">姓名:</label>
        <input type="text" id="username" placeholder="请输入文本"><br><br>
        <label for="password">密码:</label>
        <input type="password" id="password" placeholder="请输入密码"><br><br>
        
        
        <label for="gender">性别:</label>
        <input type="radio" name="gender" value="male">男
        <input type="radio" name="gender" value="female">女<br><br>
        <input type="radio" name="gender" value="other">其他<br><br>

       <label>爱好：  </label>
       <input type="checkbox" name="hobby" >唱歌
       <input type="checkbox" name="hobby" >跳舞 
       <input type="checkbox" name="hobby" >RAP
       <input type="checkbox" name="hobby" >篮球<br><br>

      <input type="submit" value="上传">

    </form>
</body>
</html>
