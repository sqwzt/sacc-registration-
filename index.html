<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SACC 2026 创新挑战赛报名</title>
    <style>
        /* ========== CSS 样式区 ========== */
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dddddd;
            --primary-color: #409eff;
            --primary-hover: #337ecc;
        }

        .dark-mode {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #f0f0f0;
            --border-color: #444444;
            --primary-color: #337ecc;
            --primary-hover: #2860a6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
            padding: 20px;
        }

        .container { max-width: 600px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .theme-toggle { cursor: pointer; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-color); background: transparent; color: var(--text-color); }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }

        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        label { font-weight: 600; font-size: 14px; }
        .required::after { content: ' *'; color: red; }

        input, select, textarea {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 14px;
            background: var(--card-bg);
            color: var(--text-color);
            transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .radio-group { flex-direction: row !important; align-items: center; gap: 16px; }
        .radio-options { display: flex; gap: 20px; font-weight: normal; }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .submit-btn:hover { background-color: var(--primary-hover); }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 360px;
            color: var(--text-color);
        }
        .receipt-info {
            background: var(--bg-color);
            padding: 12px;
            border-radius: 8px;
            margin: 16px 0;
            text-align: left;
            font-size: 14px;
        }
        .close-btn {
            margin-top: 10px;
            padding: 8px 24px;
            background: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        @media (max-width: 640px) {
            .form-row { grid-template-columns: 1fr; }
            .header h1 { font-size: 18px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header class="header">
        <h1>SACC 2026 创新挑战赛</h1>
        <button class="theme-toggle" id="themeBtn">🌙 切换暗色</button>
    </header>

    <!-- 1. 比赛信息展示区 -->
    <section class="card">
        <h2>🏆 比赛基本信息</h2>
        <p><strong>比赛名称：</strong>SACC 2026 校园创新挑战赛</p>
        <p><strong>比赛时间：</strong>2026年9月15日 - 9月17日</p>
        <p><strong>比赛地点：</strong>大学生活动中心 & 线上同步</p>
        <p><strong>报名截止：</strong>2026年9月10日 23:59</p>
        <p style="margin-top: 8px; color: #666;">本次大赛旨在激发同学们的创新思维与实践能力，涵盖设计、算法与创业三大方向。无论你是技术极客还是创意达人，这里都有属于你的舞台！</p>
    </section>

    <!-- 2. 报名表单 -->
    <form class="card" id="regForm" novalidate>
        <h2>📝 填写报名信息</h2>

        <div class="form-group">
            <label for="name" class="required">姓名</label>
            <input id="name" name="name" placeholder="请输入真实姓名" />
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="studentId" class="required">学号</label>
                <input id="studentId" name="studentId" placeholder="如：B260413XX（8位数字）" />
            </div>
            <!-- ===== 学院/专业：二级联动下拉（已替换原文本输入框） ===== -->
            <div class="form-group" id="collegeGroup">
                <label for="college" class="required">学院</label>
                <select id="college" name="college">
                    <option value="">请选择学院</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="majorSelect" class="required">专业</label>
            <select id="majorSelect" name="majorSelect">
                <option value="">请先选择学院</option>
            </select>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="phone" class="required">手机号</label>
                <input id="phone" name="phone" placeholder="11位手机号码" />
            </div>
            <div class="form-group">
                <label for="email" class="required">邮箱</label>
                <input id="email" name="email" type="email" placeholder="example@example.com" />
            </div>
        </div>

        <div class="form-group">
            <label for="category" class="required">参赛类别</label>
            <select id="category" name="category">
                <option value="" disabled selected>请选择参赛类别</option>
                <option value="design">创新设计类</option>
                <option value="algorithm">算法竞赛类</option>
                <option value="startup">创业实践类</option>
            </select>
        </div>

        <div class="form-group radio-group">
            <label class="required">是否服从调剂</label>
            <div class="radio-options">
                <label><input type="radio" name="adjust" value="yes" /> 是</label>
                <label><input type="radio" name="adjust" value="no" /> 否</label>
            </div>
        </div>

        <div class="form-group">
            <label for="bio">个人简介/参赛宣言</label>
            <textarea id="bio" name="bio" rows="4" placeholder="简单介绍一下自己或你的参赛目标吧..."></textarea>
        </div>

        <button type="submit" class="submit-btn">确认报名</button>
    </form>
</div>

<!-- 4. 提交反馈 & 选做：报名凭证 -->
<div class="modal-overlay" id="receiptModal">
    <div class="modal-card">
        <h3>🎉 报名成功！</h3>
        <p>同学你好，你的报名凭证如下：</p>
        <div class="receipt-info" id="receiptContent"></div>
        <p style="font-size: 12px; color: #888;">请截图保存此凭证，后续将用于签到核验。</p>
        <button class="close-btn" id="closeModalBtn">我知道了</button>
    </div>
</div>

<script>
    // ========== 学院-专业数据 ==========
    const collegeData = {
        '通信与信息工程学院': ['通信工程(含贝尔领军英才班)', '电子信息工程', '广播电视工程'],
        '电子与光学工程学院、柔性电子（未来技术）学院': ['电子科学与技术(含拔尖创新班)', '电磁场与无线技术', '光电信息科学与工程', '柔性电子学'],
        '集成电路科学与工程学院（产教融合学院）': ['微电子科学与工程', '集成电路设计与集成系统(含EDA菁英班)'],
        '计算机学院、软件学院、网络空间安全学院': ['计算机科学与技术(含拔尖创新班)', '信息安全', '软件工程'],
        '自动化学院': ['自动化(含拔尖创新班)', '测控技术与仪器', '电气工程及其自动化', '智能电网信息工程'],
        '人工智能学院': ['人工智能', '数据科学与大数据技术', '机器人工程'],
        '材料科学与工程学院': ['高分子材料与工程', '新能源材料与器件', '电子信息材料'],
        '化学与生命科学学院': ['分子科学与工程', '生物医学工程'],
        '物联网学院': ['网络工程', '物联网工程(含鸿蒙菁英班)', '地理信息科学', '智能感知工程', '遥感科学与技术'],
        '理学院': ['信息与计算科学(含省拔尖基地)', '应用统计学', '应用物理学', '量子信息科学'],
        '现代邮政学院、智慧交通学院': ['物流管理', '智慧交通', '邮政工程'],
        '数字媒体与设计艺术学院': ['数字媒体艺术', '数字媒体技术', '广告学'],
        '管理学院': ['工商管理', '人力资源管理', '财务管理(含拔尖创新班)', '大数据管理与应用', '信息管理与信息系统'],
        '经济学院': ['经济统计学', '金融工程(含拔尖创新班)', '数字经济'],
        '社会与人口学院、社会工作学院': ['行政管理', '社会工作(含医社菁英班)'],
        '外国语学院': ['英语'],
        '教育科学与技术学院': ['教育技术学'],
        '贝尔英才学院': ['拔尖创新人才培养'],
        '欧洲塞浦路斯学院': ['数据科学与大数据技术(中外合作办学)', '生物医学工程(中外合作办学)']
    };

    // ========== DOM 引用 ==========
    const form = document.getElementById('regForm');
    const themeBtn = document.getElementById('themeBtn');
    const receiptModal = document.getElementById('receiptModal');
    const receiptContent = document.getElementById('receiptContent');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const collegeSelect = document.getElementById('college');
    const majorSelect = document.getElementById('majorSelect');

    // ========== 渲染学院下拉 ==========
    function renderCollegeOptions() {
        const colleges = Object.keys(collegeData);
        collegeSelect.innerHTML = '<option value="">请选择学院</option>';
        colleges.forEach(col => {
            const opt = document.createElement('option');
            opt.value = col;
            opt.textContent = col;
            collegeSelect.appendChild(opt);
        });
    }
    renderCollegeOptions();

    // ========== 学院变化 → 更新专业下拉 ==========
    collegeSelect.addEventListener('change', function() {
        const selectedCollege = this.value;
        const majors = collegeData[selectedCollege] || [];
        majorSelect.innerHTML = '<option value="">请选择专业</option>';
        majors.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m;
            opt.textContent = m;
            majorSelect.appendChild(opt);
        });
        saveDraft();  // 联动时保存草稿
    });

    // ========== 深色模式切换 ==========
    themeBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        themeBtn.textContent = isDark ? '☀️ 切换亮色' : '🌙 切换暗色';
        localStorage.setItem('sacc-theme', isDark ? 'dark' : 'light');
    });
    if (localStorage.getItem('sacc-theme') === 'dark') {
        document.body.classList.add('dark-mode');
        themeBtn.textContent = '☀️ 切换亮色';
    }

    // ========== localStorage 保存草稿（含学院和专业） ==========
    const fields = ['name', 'studentId', 'phone', 'email', 'category', 'bio'];
    window.addEventListener('DOMContentLoaded', () => {
        const draft = JSON.parse(localStorage.getItem('sacc-draft') || '{}');
        fields.forEach(f => { if (draft[f]) form[f].value = draft[f]; });
        if (draft.college) {
            collegeSelect.value = draft.college;
            // 触发联动，加载对应专业列表
            collegeSelect.dispatchEvent(new Event('change'));
            if (draft.major) majorSelect.value = draft.major;
        }
        if (draft.adjust) {
            const radio = document.querySelector(`input[name="adjust"][value="${draft.adjust}"]`);
            if (radio) radio.checked = true;
        }
    });

    function saveDraft() {
        const data = {};
        fields.forEach(f => data[f] = form[f].value);
        data.college = collegeSelect.value;
        data.major = majorSelect.value;
        data.adjust = document.querySelector('input[name="adjust"]:checked')?.value || '';
        localStorage.setItem('sacc-draft', JSON.stringify(data));
    }

    form.addEventListener('input', saveDraft);
    form.addEventListener('change', saveDraft);

    // ========== 表单验证与提交 ==========
    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const data = new FormData(form);
        const name = data.get('name')?.trim();
        const studentId = data.get('studentId')?.trim();
        const phone = data.get('phone')?.trim();
        const email = data.get('email')?.trim();
        const category = data.get('category');
        const adjust = data.get('adjust');
        const college = collegeSelect.value;
        const major = majorSelect.value;

        // 必填校验（含学院和专业）
        if (!name || !studentId || !phone || !email || !category || !adjust || !college || !major) {
            alert('请确保所有必填项（带 * 号）均已填写！');
            return;
        }
        if (!/^1\d{10}$/.test(phone)) {
            alert('请输入正确的11位手机号码！');
            return;
        }
        if (!/^B\d{8}$/.test(studentId)) {
            alert('学号格式不正确，请输入8位数字学号！');
            return;
        }

        // 提交反馈 & 生成凭证
        const receiptId = 'SACC-' + Date.now().toString().slice(-8);
        const categoryMap = { design: '创新设计类', algorithm: '算法竞赛类', startup: '创业实践类' };

        receiptContent.innerHTML = `
            <p><strong>凭证编号：</strong>${receiptId}</p>
            <p><strong>姓名：</strong>${name}</p>
            <p><strong>学院：</strong>${college}</p>
            <p><strong>专业：</strong>${major}</p>
            <p><strong>参赛类别：</strong>${categoryMap[category] || category}</p>
        `;
        receiptModal.style.display = 'flex';
        localStorage.removeItem('sacc-draft');
    });

    closeModalBtn.addEventListener('click', () => {
        receiptModal.style.display = 'none';
        form.reset();
        collegeSelect.value = '';
        majorSelect.innerHTML = '<option value="">请先选择学院</option>';
        localStorage.removeItem('sacc-draft');
    });
</script>

</body>
</html>
